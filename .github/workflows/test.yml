name: Test formulae

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixcard:
    name: Fixcard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049
      - name: Tap the exact checked-out revision
        run: brew tap MarinJursic/tap "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict MarinJursic/tap/fixcard
      - name: Install formula
        run: brew install MarinJursic/tap/fixcard
      - name: Test formula
        run: brew test MarinJursic/tap/fixcard
      - name: Smoke test linked binary
        run: fixcard --version
